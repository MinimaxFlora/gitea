networks:
  gitea:
    external: false
    name: gitea
#  caddy:
#    external: true
#    name: caddy
    
services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__git_0X2E_timeout__MIGRATE=3600
      - GITEA__git_0X2E_timeout__MIRROR=1800
      - GITEA__git_0X2E_timeout__GC=60
    restart: always
    networks:
      - gitea
#      - caddy
    volumes:
      - ./git:/data/git
      - ./ssh:/data/ssh
      - ./gitea:/data/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:14.24
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    networks:
      - gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data
