networks:
  gitea:
    external: false
    name: gitea
#  caddy:
#    external: true
#    name: caddy

services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
    restart: always
    networks:
      - gitea
#      - caddy
    volumes:
      - ./git:/data/git
      - ./ssh:/data/ssh
      - ./gitea:/data/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
