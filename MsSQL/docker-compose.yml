networks:
  gitea:
    external: false
    name: gitea
#  caddy:
#    external: true
#    name: caddy

services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=mssql
      - GITEA__database__HOST=db:1433
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
    restart: always
    networks:
      - gitea
#      - caddy
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=Gitea_Strong2026!
      - MSSQL_DB=gitea
      - MSSQL_USER=gitea
      - MSSQL_PASSWORD=gitea
      - MSSQL_COLLATION=Latin1_General_100_CS_AS
    restart: always
    networks:
      - gitea
    volumes:
      - ./mssql:/var/opt/mssql
